# Staged CI (docs/phase1/tooling-bootstrap-plan.md §5; AGENTS.md H13/H15; security.md T-16, T-18).
#   foundation (incl. test-count ratchet) -> lint-types -> offline-tests -> integration (PostgreSQL service) ; secret-scan runs independently.
# Principles: offline jobs have NO network access requirement beyond installing locked dependencies, NO paid APIs and NO
# secrets; there is no job that crawls SEBI or any real source and no live URL in any test; least-privilege token.
name: foundation-checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Third-party actions are pinned to full commit SHAs (resolved from the upstream tags noted beside each use).
  UV_VERSION: "0.11.7"      # the uv that produced uv.lock
  RIG_OFFLINE_TESTS: "1"    # socket guard: zero external sockets in tests

jobs:
  foundation:
    name: foundation (stdlib only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      # Stdlib-only, offline, no secrets, no paid APIs (H13). Also fails on any stale governance reference.
      - name: Foundation checks
        run: python scripts/check_foundation.py
      # Test-count ratchet (testing-strategy §4.3): security / regression / integration test counts may not fall below the
      # checked-in baseline (tests/ratchet-baseline.json) without a reviewed, reasoned --update. Stdlib only, offline.
      - name: Test-count ratchet
        run: python scripts/check_test_ratchet.py

  lint-types:
    name: lint + types + import boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: foundation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Lockfile is up to date with pyproject.toml
        run: uv lock --check
      - name: Install from the lockfile
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run --frozen ruff check .
      - name: Ruff (format)
        run: uv run --frozen ruff format --check .
      - name: Mypy (strict)
        run: uv run --frozen mypy
      - name: Import boundaries
        run: uv run --frozen python scripts/check_imports.py

  offline-tests:
    name: offline unit / security / regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: foundation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # Everything except the tests that need a database. The in-memory variants of the shared repository contract run here.
      - name: pytest (offline, socket guard on)
        run: uv run --frozen pytest -m "not postgres" -ra

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-types, offline-tests]
    services:
      postgres:
        # PostgreSQL 16 image that ships the pgvector extension (used for the CREATE EXTENSION smoke test ONLY), pinned by
        # IMMUTABLE digest: the mutable tag `pgvector/pgvector:pg16` is documented to move (the tag-based job already ran against a
        # different image than the one this repository was developed on). The digest is the multi-platform INDEX digest of the
        # `pg16` tag observed on Docker Hub on 2026-10-04: PostgreSQL 16.15, pgvector v0.8.7, Debian bookworm.
        # EVIDENCE LEVEL: OBSERVED on Docker Hub (index digest identical on the linux/amd64 and linux/arm64 pages). NOT pull-tested
        # by the author — if the digest were wrong this job FAILS at image pull; it can never silently run another image.
        # Record, re-verification command and update procedure: docs/phase1/local-postgres-plan.md §2 "CI image pin record".
        image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_PASSWORD: postgres   # throwaway service-container credential, reachable only from this job; not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The harness refuses non-loopback / non-socket hosts and only ever creates or drops databases named rig_test_*.
      RIG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RIG_REQUIRE_POSTGRES: "1"   # a missing database FAILS the job; it is never silently skipped
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # Same migrations, same shared contract tests (this time with the PostgreSQL parametrisation), plus DB-only suites.
      - name: pytest (PostgreSQL)
        run: uv run --frozen pytest -m postgres -ra

  secret-scan:
    name: secret scan (repository-wide)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Stdlib secret scan (values are never printed)
        run: python scripts/check_secrets.py
