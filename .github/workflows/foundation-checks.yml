name: foundation-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stdlib-only, offline, no secrets, no paid APIs (H13).
      - name: Foundation checks
        run: python scripts/check_foundation.py
