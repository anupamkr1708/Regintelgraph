# RegIntelGraph source manifest -- Phase 1A reconnaissance output. DRAFT FOR HUMAN REVIEW.
#
# What this file is:    a reviewable candidate inventory + source-access gate.
# What it is NOT:       an ingestion authorisation, a legal clearance, or a completed corpus list.
# Contains no raw document content, no secrets, no contact addresses (H12).
#
# Status vocabulary used in `*_status` / `verification` fields (never blurred):
#   VERIFIED    read directly from the primary source (official SEBI page/PDF) in this session
#   OBSERVED    seen in a source this session, but NOT the canonical SEBI artifact (e.g. third-party copy)
#               or seen only as a pointer/reference inside another document
#   INFERRED    engineering deduction from observations (reasoning stated in the report)
#   UNVERIFIED  not checked / could not be checked
#
# Date fields are NOT interchangeable (H9): `listing_date` is the date shown on SEBI's listing page;
# `printed_date` is a date printed inside a document; `effective_date` is only set where document text states one.
# Evidence locations and wording analysis: docs/phase1/recon-findings.md. Access analysis: docs/phase1/source-access-report.md.

manifest_version: "0.1.0-draft"
source_id: sebi-mutual-funds
authority: sebi                      # from manifest config, never from document text (ingestion-design s2)
domain:
  jurisdiction: IN
  regulator: SEBI
  corpus: mutual-funds
  decision_ref: docs/adr/ADR-009-initial-domain-scope.md   # PROPOSED in Stage 1; treated as working decision by the Phase 1A brief
  fallback_if_validation_fails: investment-advisers          # ADR-009; NOT triggered by Phase 1A evidence

access_review_reference: docs/phase1/source-access-report.md
access_review:
  status: AMBIGUOUS_REQUIRES_REVIEW      # APPROVED_FOR_RECONNAISSANCE | BLOCKED | AMBIGUOUS_REQUIRES_REVIEW
  reviewed_by: null                      # human reviewer must fill before status can change
  reviewed_at: null
  open_items:                            # all must be closed by a human before ingestion_authorized can be true
    - robots.txt for www.sebi.gov.in not retrieved (sandbox egress denied, host_not_allowed) -> UNVERIFIED
    - Copyright Policy requires permission (by mail) for reproduction; scope vs internal storage/quote display undecided
    - Website Policy is silent on automated retrieval -> neither permitted nor prohibited by text
    - Listing pagination is JavaScript-driven; permissibility/shape of programmatic enumeration unreviewed
ingestion_authorized: false              # fail-closed: Phase 1B code MUST refuse to fetch while false

allowed_hosts:                           # exact hosts; no wildcards (ingestion-design s3, security T-04/T-07)
  - www.sebi.gov.in
allowed_url_policy:
  schemes: [https]
  allowed_methods: [GET, HEAD]
  # Observed path families on www.sebi.gov.in (OBSERVED, not an exhaustive or guaranteed contract):
  path_prefixes:
    listing:    ["/sebiweb/home/HomeAction.do"]
    detail:     ["/legal/master-circulars/", "/legal/circulars/", "/legal/regulations/", "/reports-and-statistics/reports/"]
    attachment: ["/sebi_data/attachdocs/", "/sebi_data/commondocs/"]
  viewer_wrapper_note: >
    Detail pages link attachments through a viewer URL of the form /web/?file=<absolute pdf url>.
    The viewer must never be fetched; the inner URL must be extracted and validated by the same rules (OBSERVED).

listing_urls:
  # Listing pages fetched once each during Phase 1A (read-only). `stability` is UNVERIFIED for all:
  # they are query-string endpoints of SEBI's own site, surfaced by search, not documented as stable APIs.
  - id: legal-master-circulars-updated
    url: "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=1&ssid=6"
    observed: "'Updated List' mode, 134 records across 6 pages; page 1 (25 records) read. Has a separate 'Historical Data' mode (not opened)."
    stability: UNVERIFIED
  - id: mf-circular-title-search
    url: "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListingAll=yes&search=Circular+For+Mutual+Funds"
    observed: "15 records on one page: 10 Master Circulars for Mutual Funds (2011-01-07 .. 2026-03-20) + 5 Circulars (2010-2012). Complete for that title query only."
    stability: UNVERIFIED
  - id: mf-keyword-search
    url: "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListingAll=yes&search=Mutual+Funds"
    observed: "486 records, 20 pages; page 1 (25 records, 2026-08-11 .. 2025-04-17) read. Includes non-regulatory noise (recovery notices, speeches). Pagination is JS-driven; pages 2-20 NOT read."
    known_gaps: "Two in-window Mutual Funds circulars referenced by official documents are absent from page 1 (2026-02-26 categorisation circular; 2026-05-19 MCR-format circular) -> a title-keyword search under-enumerates. Department-filtered listing (Investment Management Department) is a candidate alternative, UNVERIFIED."
    stability: UNVERIFIED

document_types:           # manifest vocabulary; extraction of exact types remains a candidate (T-09)
  - master_circular
  - circular
  - regulation                  # principal regulations, incl. SEBI "last amended" consolidated pages
  - amendment_regulation
  - draft_circular_consultation # context only; not a regulatory instrument until issued
  - consultation_paper          # context only
excluded_types_observed:        # seen on the listings; excluded from this manifest's scope
  - recovery_proceedings
  - informal_guidance
  - speeches
  - older_master_circulars_before_window   # kept only as context entries below

bounded_date_window:
  from: "2024-06-27"      # date of the predecessor Master Circular (listing_date); included at the boundary
  to: "2026-07-10"        # latest Mutual Funds item seen on listing page 1 (circular); post-dates the 2026-07-07 regulation amendment
  basis: INFERRED
  rationale_ref: docs/phase1/recon-findings.md#bounded-corpus-window
  contains_transition: "Master Circular 2024-06-27 -> 2026-03-20; MF Regulations 1996 (last amended 2025-11-01) -> MF Regulations 2026 (listing 2026-04-01) -> 2026 amendment (2026-07-07)"
  coverage_caveat: "Items between 2024-06-27 and 2025-04-17 are NOT enumerated (listing page 2+ unread). Known candidate count is a floor, not the corpus size."

crawl:
  status: NOT_CONFIGURED         # min_delay / max_bytes / timeouts / retries are required here before any fetch (source-safety-contract)
  user_agent_contact: env:RIG_CRAWLER_CONTACT_EMAIL   # unset in .env.example; must be set before any live fetch

document_overrides: []           # manual identity/date corrections (reason + reviewer required); none at Phase 1A

